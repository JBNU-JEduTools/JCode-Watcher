name: Image build

on:
  pull_request:
    branches: [develop]
    paths:
      - "packages/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, filemon, procmon]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: packages/${{ matrix.component }}
          push: false
