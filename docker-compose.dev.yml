services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: watcher
      POSTGRES_USER: watcher
      POSTGRES_PASSWORD: watcher
    volumes:
      - watcher-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watcher -d watcher"]
      interval: 5s
      timeout: 5s
      retries: 20

  watcher-migration:
    build:
      context: ./packages/backend
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      DB_URL: postgresql+psycopg://watcher:watcher@postgres:5432/watcher
      AUTO_CREATE_SCHEMA: "false"
    depends_on:
      postgres:
        condition: service_healthy

  watcher-backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      AUTO_CREATE_SCHEMA: "false"
      DB_URL: postgresql+psycopg://watcher:watcher@postgres:5432/watcher
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      watcher-migration:
        condition: service_completed_successfully

  # 파일 모니터링 서비스
  watcher-filemon:
    build:
      context: ./packages/filemon
      dockerfile: Dockerfile
    ports:
      - "9090:3000"
    volumes:
      - ./dev-workspace:/watcher/codes:ro
      - ./dev-data/filemon-snapshots:/watcher/snapshots
      - ./packages/filemon/src:/app/src
    environment:
      - LOG_LEVEL=DEBUG
      - API_SERVER=http://watcher-backend:3000
      - METRICS_PORT=3000
      - PYTHONUNBUFFERED=1
    depends_on:
      watcher-backend:
        condition: service_healthy
    restart: unless-stopped

  # 프로세스 모니터링 서비스  
  watcher-procmon:
    build:
      context: ./packages/procmon
      dockerfile: Dockerfile
    ports:
      - "9091:3000"
    volumes:
      - ./packages/procmon/src:/app/src
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
    environment:
      - API_SERVER=http://watcher-backend:3000
      - LOG_LEVEL=DEBUG
      - METRICS_PORT=3000
      - PYTHONUNBUFFERED=1
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    pid: host
    depends_on:
      watcher-backend:
        condition: service_healthy
    restart: unless-stopped

  # WebIDE (Code Server)
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    ports:
      - "8443:8443"
    volumes:
      - ./dev-workspace:/config/workspace
      - ./dev-logs:/config/logs
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
      - PASSWORD=watcher123
      - SUDO_PASSWORD=watcher123
      - DEFAULT_WORKSPACE=/config/workspace
    restart: unless-stopped

networks:
  default:
    name: watcher-dev-network

volumes:
  watcher-postgres:
