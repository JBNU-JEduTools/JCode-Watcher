apiVersion: batch/v1
kind: Job
metadata:
  name: watcher-backend-migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: watcher-backend-migration
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: watcher-harbor-registry-secret
      containers:
        - name: migrate
          image: harbor.jedutools.io/jdevops/watcher-backend:REPLACE_WITH_COMMIT_SHA
          workingDir: /app
          command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: watcher-postgres-app
                  key: uri
            - name: AUTO_CREATE_SCHEMA
              value: "false"
